server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Serve assets normally
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Cache immutable assets longer
  location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
    expires 7d;
    access_log off;
    add_header Cache-Control "public, max-age=604800";
    try_files $uri $uri/ /index.html;
  }
}
